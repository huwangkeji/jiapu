# ============================================
# 族谱传承 - Nginx 安全加固配置
# 将以下内容添加到你的 Nginx 站点配置的 server {} 块中
# ============================================

# 0. 隐藏 Nginx 版本号
server_tokens off;

# 1. 禁止访问敏感文件
location ~* ^/(config\.php|\.env|database\.sql|db_upgrade|db_fix|debug_.*\.log) {
    deny all;
    return 404;
}

# 2. uploads 目录禁止执行 PHP
location ~* ^/uploads/.*\.(php|phtml|php3|php4|php5|pht|phar)$ {
    deny all;
    return 403;
}

# 3. includes 目录禁止直接访问
location ~* ^/includes/.*\.(php)$ {
    deny all;
    return 403;
}

# 4. 禁止访问隐藏文件（如 .git, .htaccess 等）
location ~ /\. {
    deny all;
    return 404;
}

# 5. 禁止访问备份文件和临时文件
location ~* \.(bak|old|orig|swp|tmp|sql|log|env)$ {
    deny all;
    return 404;
}

# 6. 静态资源缓存（提升加载速度）
location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, no-transform";
    add_header X-Content-Type-Options "nosniff";
}

# 7. PHP 安全：隐藏版本号
# 在 php.ini 中设置：expose_php = Off

# 8. 请求体大小限制（匹配 upload_max_filesize）
client_max_body_size 5m;
